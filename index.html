<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Discover">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" id="icon">
<title>Entdecke Wikipedia</title>
<style>
  :root { --bg: #f6f6f6; --surface: #fff; --text: #202122; --border: #ddd; --link: #0645ad; --hover: #eee; --current: #dce8ff; --muted: #666; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; --border: #3a3a3a; --link: #8ab4f8; --hover: #2c2c2c; --current: #263a5a; --muted: #9aa0a6; }
  :root[data-theme="dark"] #content [style*="background"] { background: transparent !important; color: inherit !important; }
  :root[data-theme="dark"] #content img { opacity: .85; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 8px; padding: 0 10px; z-index: 10; }
  header h1 { flex: 1; font-size: 1rem; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 6px 12px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  main { position: absolute; top: 52px; bottom: 0; left: 0; right: 0; overflow-y: auto; touch-action: pan-y; transition: transform .25s, opacity .25s; }
  main.out-left { transform: translateX(-40%); opacity: 0; }
  main.out-right { transform: translateX(40%); opacity: 0; }
  #content { max-width: 800px; margin: 0 auto; padding: 16px; background: var(--surface); min-height: 100%; line-height: 1.6; overflow-wrap: anywhere; }
  #content img { max-width: 100%; height: auto; }
  #content .table-wrap { overflow-x: auto; margin: 1em 0; max-width: 100%; }
  #content table { display: table; float: none !important; margin: 0 auto; border-collapse: collapse; overflow-wrap: normal; word-break: normal; }
  #content td, #content th { padding: 4px 8px; border: 1px solid var(--border); vertical-align: top; }
  #content .thumb, #content figure, #content .floatright, #content .floatleft { margin: .5em 0 .5em 1em; max-width: 45%; width: auto !important; float: right; clear: right; font-size: .85em; }
  #content .thumb.tleft, #content .floatleft, #content figure[class*="mw-halign-left"] { float: left; clear: left; margin: .5em 1em .5em 0; }
  #content .thumb.tnone, #content .thumb.tmiddle, #content figure[class*="mw-halign-center"] { float: none; margin: 1em auto; max-width: 100%; }
  #content .thumbinner { width: auto !important; max-width: 100%; }
  #content .thumbcaption, #content figcaption { color: var(--muted); }
  @media (max-width: 600px) {
    #content .thumb, #content figure, #content .floatright, #content .floatleft { float: none; margin: 1em auto; max-width: 100%; }
  }
  #content a { color: var(--link); text-decoration: none; }
  #content h1, #content h2 { border-bottom: 1px solid var(--border); }
  #status { padding: 40px; text-align: center; color: var(--muted); }
  #history { position: fixed; top: 52px; right: 0; bottom: 0; width: min(320px, 90vw); background: var(--surface); border-left: 1px solid var(--border);
            overflow-y: auto; padding: 8px; display: none; z-index: 9; }
  #history.open { display: block; }
  #history div { padding: 8px; border-radius: 6px; cursor: pointer; }
  #history div:hover { background: var(--hover); }
  #history div.current { background: var(--current); font-weight: bold; }
</style>
</head>
<body>
<header>
  <button id="back" title="Zurück (←)">←</button>
  <h1 id="title">Lädt…</h1>
  <button id="theme" title="Darkmode umschalten">🌙</button>
  <button id="histBtn" title="Verlauf">Verlauf</button>
  <button id="next" title="Neuer Artikel (→)">→</button>
</header>
<main id="main"><div id="content"><div id="status">Lädt…</div></div></main>
<aside id="history"></aside>

<script>
const API = 'https://de.wikipedia.org/w/api.php';

const trail = [];            // besuchte Artikeltitel
let pos = -1;                // aktuelle Position im Verlauf
const cache = new Map();     // Titel -> { html, links }
let busy = false;

const $ = id => document.getElementById(id);
const main = $('main'), content = $('content');

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

const START_PAGE = 'Wikipedia:Hauptseite/Schon gewusst';

async function loadPage(title) {
  if (cache.has(title)) return cache.get(title);
  const j = await fetchJSON(`${API}?action=parse&page=${encodeURIComponent(title)}&redirects=1&prop=text|links&disableeditsection=1&format=json&formatversion=2&origin=*`);
  if (j.error) throw new Error(j.error.info);
  const doc = new DOMParser().parseFromString(j.parse.text, 'text/html');
  doc.querySelectorAll('style, script, .mw-editsection, .navbox, .metadata, .noprint, .reference, .mw-empty-elt, .hatnote, sup.reference')
     .forEach(e => e.remove());
  const links = j.parse.links.filter(l => l.ns === 0 && l.exists).map(l => l.title);
  const page = { title: j.parse.title, html: doc.body.innerHTML, links };
  cache.set(title, page);
  cache.set(page.title, page);
  return page;
}

async function show(title, dir) {
  busy = true;
  $('title').textContent = title;
  main.classList.add(dir === 'back' ? 'out-right' : 'out-left');
  try {
    const page = await loadPage(title);
    content.innerHTML = `<h1>${page.title}</h1>` + page.html;
    content.querySelectorAll('table').forEach(t => {
      if (t.parentElement.closest('table')) return;
      const w = document.createElement('div');
      w.className = 'table-wrap';
      t.replaceWith(w);
      w.appendChild(t);
    });
    $('title').textContent = page.title;
    main.scrollTop = 0;
  } catch (e) {
    content.innerHTML = `<div id="status">Fehler: ${e.message}</div>`;
  }
  main.classList.remove('out-left', 'out-right');
  busy = false;
  update();
}

function pickNext() {
  const cur = cache.get(trail[pos]);
  const links = cur ? cur.links : [];
  const unseen = links.filter(l => !trail.includes(l));
  const pool = unseen.length ? unseen : links;
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

async function goNext(forcedTitle) {
  if (busy) return;
  const t = forcedTitle || pickNext();
  if (!t) return;
  trail.push(t);
  pos = trail.length - 1;
  await show(t, 'next');
}

async function goBack() {
  if (busy || pos <= 0) return;
  pos--;
  await show(trail[pos], 'back');
}

async function jumpTo(i) {
  if (busy || i === pos) return;
  const dir = i < pos ? 'back' : 'next';
  pos = i;
  await show(trail[pos], dir);
}

function update() {
  $('back').disabled = pos <= 0;
  const h = $('history');
  h.innerHTML = '';
  trail.forEach((t, i) => {
    const d = document.createElement('div');
    d.textContent = t;
    if (i === pos) d.className = 'current';
    d.onclick = () => { h.classList.remove('open'); jumpTo(i); };
    h.appendChild(d);
  });
}

// Links im Artikel öffnen den verlinkten Artikel als neuen Eintrag
content.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  const m = a.getAttribute('href') && a.getAttribute('href').match(/^\/wiki\/([^#?:]+)/);
  if (m) goNext(decodeURIComponent(m[1]).replace(/_/g, ' '));
});

// Swipe: nach rechts = neuer Artikel, nach links = zurück
let sx = 0, sy = 0;
main.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
main.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 80 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  dx > 0 ? goNext() : goBack();
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goBack();
});
$('next').onclick = () => goNext();
$('back').onclick = goBack;
$('histBtn').onclick = () => $('history').classList.toggle('open');

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? '☀️' : '🌙';
}
setTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', t);
  setTheme(t);
};

// Basis-Eintrag + App-Eintrag: Browser-Zurück landet auf der Basis und wirkt wie Swipe links
window.history.replaceState({ base: true }, '');
window.history.pushState({ app: true }, '');
window.addEventListener('popstate', e => {
  if (!e.state || !e.state.base) return;
  if (pos > 0) {
    window.history.pushState({ app: true }, '');
    goBack();
  } else {
    window.history.back();
  }
});

// Icon zur Laufzeit zeichnen, damit die App weiter nur aus einer Datei besteht
(() => {
  const c = document.createElement('canvas');
  c.width = c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#0645ad';
  g.fillRect(0, 0, 180, 180);
  g.fillStyle = '#fff';
  g.font = 'bold 120px serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('W', 90, 95);
  $('icon').href = c.toDataURL('image/png');
})();

(async () => {
  try {
    const links = (await loadPage(START_PAGE)).links;
    const t = links[Math.floor(Math.random() * links.length)];
    trail.push(t);
    pos = 0;
    await show(t, 'next');
  } catch (e) {
    content.innerHTML = `<div id="status">Fehler: ${e.message}</div>`;
  }
})();
</script>
</body>
</html>
